name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: License check
        run: pnpm check:licenses

      - name: Size check
        run: |
          pnpm --filter @cuteclown/motion build
          pnpm --filter @cuteclown/core build
          pnpm check:size
